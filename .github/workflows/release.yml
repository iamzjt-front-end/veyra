name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact package version tag, for example v0.1.0"
        required: true
        type: string
      npm_tag:
        description: "latest for stable versions, next for prereleases"
        required: true
        type: choice
        options: [latest, next]
        default: latest
      publish:
        description: "Request public publication after reviewing the verification artifact and approving npm-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  NPM_DIST_TAG: ${{ inputs.npm_tag }}

jobs:
  verify:
    name: Verify and prepare review artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      TURBO_FORCE: "true"
    steps:
      - name: Check out exact source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false

      - name: Enable pinned tooling
        run: |
          npm install --global corepack@0.34.7
          corepack enable
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version, tag and release readiness
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then args+=(--ready); fi
          node scripts/release.mjs check --tag "$RELEASE_TAG" --dist-tag "$NPM_DIST_TAG" "${args[@]}"

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package consumers
        run: pnpm packages:check

      - name: Pack review artifacts
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/veyra-release
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then args+=(--ready); fi
          node scripts/release.mjs pack --tag "$RELEASE_TAG" --dist-tag "$NPM_DIST_TAG" --out "$RELEASE_DIRECTORY" "${args[@]}"

      - name: Upload tarballs, checksums and release notes
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veyra-release-${{ github.sha }}
          path: ${{ runner.temp }}/veyra-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Approved public npm and GitHub release
    needs: verify
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'iamzjt-front-end/veyra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the verified commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.1

      - name: Download this run's verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/veyra-release/

      - name: Publish exact tarballs with provenance and verify registry integrity
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/veyra-release
          VEYRA_RELEASE_APPROVED: "true"
        run: node scripts/release.mjs publish --tag "$RELEASE_TAG" --dist-tag "$NPM_DIST_TAG" --out "$RELEASE_DIRECTORY"

      - name: Create matching GitHub release after npm verification
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/veyra-release
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --tags
          node scripts/release.mjs check --tag "$RELEASE_TAG" --dist-tag "$NPM_DIST_TAG" --ready
          args=()
          if [[ "$NPM_DIST_TAG" == "next" ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "$RELEASE_DIRECTORY"/*.tgz "$RELEASE_DIRECTORY/release.json" "$RELEASE_DIRECTORY/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "Veyra $RELEASE_TAG" \
            --notes-file "$RELEASE_DIRECTORY/RELEASE_NOTES.md" "${args[@]}"
