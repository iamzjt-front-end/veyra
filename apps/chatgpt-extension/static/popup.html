<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Veyra Experimental Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Veyra <small>Experimental</small></h1>
    <p>连接本机项目，在当前 ChatGPT 会话自动派发并回传结果。</p>
    <label for="pairing">1. 导入 daemon 配对文件（本次浏览器会话有效）</label>
    <input id="pairing" type="file" accept="application/json,.json" />
    <button id="detect" type="button">检测 daemon / 刷新项目</button>
    <label for="project">2. 选择已在本机授权的 Project</label>
    <select id="project">
      <option value="">先检测 daemon</option>
    </select>
    <label for="limit">3. 本次绑定最多自动执行次数（含修复）</label>
    <select id="limit">
      <option>1</option>
      <option>2</option>
      <option selected>3</option>
      <option>4</option>
      <option>5</option>
    </select>
    <p>
      绑定会发送项目状态到当前会话；新的显式 handoff 会修改本地代码。先清空输入框并等待 GPT
      生成结束。
    </p>
    <button id="bind" type="button">绑定当前会话并启用自动执行</button>
    <button id="stop" type="button">停止自动桥接 / 取消当前 run</button>
    <p id="status" role="status" aria-live="polite">尚未连接</p>
    <p class="note">
      仅 Chrome/Chromium + chatgpt.com。切换、刷新或关闭页面会暂停回传；工程证据保留在
      .veyra/。不读取其他会话和登录凭证。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
