# yaml-language-server: $schema=../../../packages/workflow/schema/workflow-v1.schema.json
name: route-check-result
version: 1
start: check
steps:
  check:
    type: command
    run: ["node --test"]
    on:
      success: choose
      failure: choose
  choose:
    type: router
    route: { from: check, path: /outcome }
    on:
      success: done
      failure: inspect
  inspect:
    type: human
    message: Tests failed. Inspect their saved evidence before continuing.
    next: done
  done:
    type: end
