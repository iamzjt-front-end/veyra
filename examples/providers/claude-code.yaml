version: 1
project:
  name: claude-code-development
workflow:
  use: dev
agents:
  planner:
    provider: openai
    model: replace-with-an-accessible-structured-output-model
  executor:
    provider: claude-code
    options:
      maxTurns: 20
      timeoutMs: 900000
      allowedTools:
        - Read
        - Edit
        - Write
        - Bash(pnpm check)
        - Bash(pnpm test)
        - Bash(pnpm build)
  reviewer:
    provider: openai
    model: replace-with-an-accessible-structured-output-model
